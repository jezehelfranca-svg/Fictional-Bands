name: Add Suno Exclude Styles to band profiles

on:
  push:
    paths:
      - ".github/workflows/add-suno-blueprint.yml"
      - "tools/add_suno_blueprint.py"
      - "*"
      - "!README.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  add-suno-blueprint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Add Exclude Styles and clamp style prompts to 1,000 characters
        run: python tools/add_suno_blueprint.py

      - name: Commit catalog-wide Suno blueprint update
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -maxdepth 1 -type f ! -name 'README.md' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "No catalog changes detected."
            exit 0
          fi
          git commit -m "Add Suno Exclude Styles to band profiles"
          git push
