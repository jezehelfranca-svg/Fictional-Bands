name: Update fictional band song concepts

on:
  push:
    paths:
      - ".github/workflows/update-song-titles.yml"
      - "tools/update_song_titles.py"
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-song-concepts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Expand song titles into cinematic concepts
        run: python tools/update_song_titles.py

      - name: Commit catalog-wide song concept expansion
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          find . -maxdepth 1 -type f ! -name 'README.md' -print0 | xargs -0 git add --
          if git diff --cached --quiet; then
            echo "No catalog changes detected."
            exit 0
          fi
          git commit -m "Expand fictional band songs with cinematic descriptions"
          git push
